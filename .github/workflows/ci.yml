name: CI

# КОЛИ запускати
on:
  pull_request:
    branches: [ dev, main ]          # будь-який PR у dev або main
  push:
    branches:
      - dev
      - 'feature/**'                 # усі гілки feature/...
      - 'fix/**'                     # усі гілки fix/...

# Якщо прийшов новий пуш у ту саму гілку — скасувати попередній запуск
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, тести та збірка
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Забираємо код репозиторію
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Ставимо JDK 21 (потрібен для AGP 8.9 / Kotlin 2.1, targetJvm=21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Підключаємо Gradle з кешуванням (швидші повторні білди)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Підставляємо секретний google-services.json
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      # 5. Робимо gradlew виконуваним (на Linux біт інколи губиться)
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 6. Перевірка стилю коду
      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace

      # 7. Юніт-тести (JUnit 5 + MockK)
      - name: Unit tests
        run: ./gradlew test --stacktrace

      # 8. Збірка debug-APK (переконатися, що застосунок взагалі збирається)
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      # 9. Зберегти звіти тестів навіть якщо щось упало
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      # 10. Зберегти зібраний APK як артефакт
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
